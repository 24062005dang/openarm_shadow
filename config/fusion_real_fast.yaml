# Robot thật + fusion: cổ tay bám nhanh hơn nhưng VẪN GIỮ các lớp an toàn (khác bản Openarm_Teleop tắt hẳn giới
# hạn tốc độ / tăng tốc mềm / chặn bước nhảy). Đặt SAU config cổ tay thật và config fusion:
#   python scripts/shadow.py --source multi --robot openarm --arms right \
#       --config config/wrist_real_30.yaml --config config/fusion_2cam.yaml --config config/fusion_real_fast.yaml
#
# Chỉ dùng khi: dry-run đã xác nhận chiều J5-J7, đã chạy ổn wrist_real_30.yaml (30°/s), có người giữ E-stop,
# không ai trong tầm với. Cổ tay mặc định 45°/s (90°/s từng làm cổ tay tự xoay nhanh khi mất hướng tay lúc tay để
# ngang). Chỉ tăng 45 -> 60°/s sau khi đã chạy ổn nhiều phút và dòng trạng thái không còn nhảy HOLD/ACQUIRE.
# (Xoay cổ tay người nhanh tới 200-350°/s: robot sẽ luôn chậm hơn người một chút khi xoay rất nhanh - chấp nhận.)

safety:
  #               J1  J2  J3  J4  J5  J6  J7
  max_vel_deg_s: [30, 30, 40, 40, 45, 45, 45]
  engage_blend_s: 1.0        # tăng tốc mềm 1 s khi engage (bản kia: 0 = lao tới mục tiêu trong 1 nhịp)
  resume_after_s: 0.3        # khớp đứng yên (mất nhận diện) > 0.3 s rồi chạy lại -> tăng tốc mềm riêng khớp đó
  resume_blend_s: 1.0

filter:
  #           J1    J2    J3    J4    J5   J6   J7   kẹp
  min_cutoff: [0.8, 0.8, 0.7, 0.8, 1.5, 1.5, 1.5, 1.5]
  beta:       [0.5, 0.5, 0.5, 0.5, 1.0, 1.0, 1.0, 0.3]       # J1-J4 0.5: bớt ~70 ms trễ; đứng yên rung hơn nếu Pose nhiễu -> hạ về 0.2
  deadband_deg: [1.0, 1.0, 1.5, 1.0, 1.5, 1.5, 1.5, 0]
  # Bước nhảy lớn hơn jump_deg trong 1 khung bị giữ jump_hold_s rồi mới nhận (chỉ làm chậm, không chặn hẳn).
  # Chống lật hướng tay là việc của OrientationFusion (đổi > 100° cần 3 khung; vừa thấy lại tay thì ACQUIRE: cổ tay
  # đứng yên tới khi hướng ổn định vài khung);
  # bộ lọc chỉ là lớp phụ. Kẹp đơn vị 0..1: 35 = không chặn.
  jump_deg: [35, 35, 35, 35, 60, 60, 60, 35]
  jump_hold_s: 0.3

fusion:
  orientation_fusion: {alpha: 0.7, fast_alpha: 0.95, fast_angle_deg: 45}
