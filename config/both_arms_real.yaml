# Hai tay OpenArm thật. Đặt SAU wrist_real_30.yaml (tay phải + kẹp), TRƯỚC config fusion:
#   python scripts/shadow.py --source multi --robot openarm --dry-run \
#       --config config/wrist_real_30.yaml --config config/both_arms_real.yaml --config config/fusion_3cam.yaml
#   (bỏ --dry-run để chạy thật, sau khi dry-run đã đúng chiều mọi khớp tay trái)
#
# Tay phải: như wrist_real_30.yaml (đã chạy ổn 02/10: J1-J7 + kẹp). Tay trái: giới hạn khớp = ảnh gương tay phải
# (left: mirror), cổ tay mở như tay phải; offset và chiều bên dưới. Lượt đầu thận trọng: ghép first_real.yaml thay
# wrist_real_30.yaml -> hai tay chỉ J1-J4 nhỏ.

mapping:
  robot_arms: [right, left]

safety:
  soft_limits_deg:
    # Tay trái điều khiển y như tay phải: giới hạn = ảnh gương giới hạn tay phải (mapping.arm.MIRROR_SIGNS; J1, J2 đảo
    # dấu: phải J2 [-9, 90] -> trái [-90, 9]). Tính sau khi ghép config: first_real -> trái cũng chỉ J1-J4 nhỏ,
    # wrist_real_30 -> trái mở J1-J7 như phải.
    left: mirror

robot:
  urdf_to_motor:
    left:
      # Chiều đã kiểm chứng bằng dry-run 02/10, cả 7 khớp + kẹp đúng URDF: J1 nâng trước -, J2 dang -, J3 xoay ra
      # ngoài -, J4 gập +, J5 xoay ra ngoài -, J6 kẹp ra xa thân +, J7 kẹp về trước -, kẹp mở + (kẹp: trước zero mới 05/10; nay mở -).
      sign: [1, 1, 1, 1, 1, 1, 1]
      # 05/10: tay trái đã chạy lại openarm-can-zero-position-calibration (cả 7 khớp + kẹp) -> zero motor MỚI, J1/J2
      # không còn lệch 180°. Đọc read_joints.py --iface can1 (motor tắt) ở tư thế nghỉ, tay buông, khuỷu tựa chặn:
      #   J1 -0.8  J2 -0.3  J3 -0.5  J4 0.4 (tựa chặn)  J5 2.8  J6 -2.6  J7 -0.0  kẹp -0.0
      # J4 2.9 (= 0.4 + 2.5): chặn -> URDF -2.5°, lệnh 0° không ép khuỷu vào chặn (cùng cách làm 02/10).
      # J5/J6 đo lúc motor tắt, cổ tay xoay tự do: kiểm tra lại bằng dry-run (hình que xanh lá cổ tay thẳng ~0).
      # Số cũ (02/10, trước khi hiệu chuẩn lại zero): [177.4, 180.0, -1.8, -5.0, -72.1, 8.8, -0.2] - KHÔNG dùng nữa.
      offset_deg: [-0.8, -0.3, -0.5, 2.9, 2.8, -2.6, 0.0]
  gripper:
    # Kẹp tay trái: zero motor mới 05/10 (read_joints.py --iface can1): đóng hết cỡ ~0°, mở hết cỡ -68.4° (chặn cơ khí).
    # Dùng 60° hành trình như tay phải (mở -60°: cách chặn ~8°, không ép vào chặn).
    # Số cũ (02/10): đóng 53.0°, mở ~-14.8° - không còn đúng.
    # Kẹp phải: robot.gripper chung (wrist_real_30.yaml).
    left: {enabled: true, open_deg: -60.0, closed_deg: 0.0}
