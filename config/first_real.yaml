# Cấu hình cho LẦN CHẠY THẬT ĐẦU TIÊN (chỉ ghi các khoá khác config/default.yaml).
#   python scripts/shadow.py --robot openarm --arms right --config config/first_real.yaml
#
# - Chỉ J1–J4 (vai + khuỷu). J5, J6, J7 khoá ở 0: chiều J5–J7 chưa đo (docs/SAFETY.md bước 3).
# - Biên độ nhỏ: tay không giơ quá 45°, không khép vào giữa ngực.
# - Tốc độ tối đa 20°/s, engage chậm 3 s.
# - Không bù trọng lực: với biên độ này tay võng khoảng vài độ, chấp nhận được cho lần đầu.
# Chạy ổn rồi mới nới dần từng giới hạn, hoặc quay về config/default.yaml.

safety:
  max_vel_deg_s: [20, 20, 20, 20, 20, 20, 20]
  engage_blend_s: 3.0
  soft_limits_deg:
    #        J1          J2         J3          J4        J5      J6      J7
    right: [[-10, 45], [0, 45], [-30, 30], [0, 90], [0, 0], [0, 0], [0, 0]]
    left:  [[-45, 10], [-45, 0], [-30, 30], [0, 90], [0, 0], [0, 0], [0, 0]]

robot:
  park_vel_deg_s: 15
  # Bù zero bằng phần mềm (góc motor = góc URDF + offset). Không ghi gì vào motor.
  # J4: tay thả thẳng (khuỷu tựa vào chặn cơ khí = 0° URDF) motor đọc -7.7° ngày 30/09
  # (ngày 28/09 đọc -1.9°). ĐO LẠI mỗi buổi bằng tools/bringup/read_joints.py và sửa số này.
  urdf_to_motor:
    right:
      sign: [1, 1, 1, 1, 1, 1, 1]
      offset_deg: [0, 0, 0, -7.7, 0, 0, 0]
