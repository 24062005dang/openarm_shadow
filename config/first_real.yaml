# Cấu hình cho LẦN CHẠY THẬT ĐẦU TIÊN (chỉ ghi các khoá khác config/default.yaml).
#   python scripts/shadow.py --source multi --robot openarm --arms right \
#       --config config/real.yaml --config config/fusion_3cam.yaml --config config/first_real.yaml
#
# - Chỉ J1–J4 (vai + khuỷu). J5, J6, J7 khoá ở 0: chiều J5–J7 chưa đo (docs/SAFETY.md bước 3).
# - Biên độ nhỏ: tay không giơ quá 45°, không khép vào giữa ngực.
# - Tốc độ tối đa 20°/s, engage chậm 3 s.
# - Đặt SAU real.yaml: lấy offset / kẹp / hai tay / bù trọng lực của real.yaml, chỉ thu nhỏ giới hạn và tốc độ.
# Chạy ổn rồi bỏ file này (chạy real.yaml).

safety:
  max_vel_deg_s: [20, 20, 20, 20, 20, 20, 20]
  engage_blend_s: 3.0
  soft_limits_deg:
    #        J1          J2         J3          J4        J5      J6      J7
    right: [[-10, 45], [0, 45], [-30, 30], [0, 90], [0, 0], [0, 0], [0, 0]]
    left:  [[-45, 10], [-45, 0], [-30, 30], [0, 90], [0, 0], [0, 0], [0, 0]]

robot:
  park_vel_deg_s: 15
  # Bù zero bằng phần mềm (góc motor = góc URDF + offset). Không ghi gì vào motor.
  # J4: tay thả thẳng (khuỷu tựa vào chặn cơ khí = 0° URDF) motor đọc -1.0..-6.2° ngày 01/10 (khuỷu rơ, mỗi lần
  # tựa một khác; 30/09 -7.7°, 28/09 -1.9°). -3.0: góc khởi động phải >= offset - 5° (nếu không, từ chối bật motor)
  # nên vẫn bật được khi đọc tới -8°; âm hơn nữa thì lệnh 0° ép khuỷu vào chặn cơ khí.
  # ĐO LẠI mỗi buổi bằng tools/bringup/read_joints.py và sửa số này.
  urdf_to_motor:
    right:
      sign: [1, 1, 1, 1, 1, 1, 1]
      offset_deg: [0, 0, 0, -3.0, 0, 0, 0]
