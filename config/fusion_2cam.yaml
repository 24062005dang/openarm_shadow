# Fusion 2 camera cho 1 tay (tay phải):
#   camera 0 = iPhone (DroidCam, chế độ PC Webcam) qua cáp USB, TRỰC DIỆN (khung tham chiếu, không có depth)
#   camera 1 = RealSense D435i, lệch ~45° về phía tay phải (có depth)
#
#   python scripts/list_cameras.py                       # xem chỉ số webcam laptop + serial D435i
#   python scripts/calibrate_cameras.py --config config/fusion_2cam.yaml   # hiệu chuẩn (webcam: cả nội tham số)
#   python scripts/shadow.py --source multi --arms right --config config/fusion_2cam.yaml
#   robot thật: thêm --config config/first_real.yaml TRƯỚC file này, vd
#   python scripts/shadow.py --source multi --robot openarm --arms right \
#       --config config/first_real.yaml --config config/fusion_2cam.yaml
#
# Camera đầu tiên là khung tham chiếu và là camera để tự hiệu chuẩn tay ("lòng bàn tay nhìn camera").
# Khi cắm D435i, nó cũng tạo thêm vài /dev/video*: webcam laptop KHÔNG chắc là chỉ số 0, kiểm tra bằng list_cameras.

fusion:
  cameras:
    # iPhone trực diện qua USB: app DroidCam (chọn "PC Webcam") để ở màn hình chính, rồi trên PC chạy
    #   iproxy 4747:4747        (gói libusbmuxd-tools; chuyển cổng 4747 của iPhone qua cáp)
    # Đặt iPhone nằm ngang trên giá, cao ngang ngực, cách người 1,2-1,5 m, thấy trọn vai-hông-tay, không zoom.
    # Xê dịch iPhone sau khi hiệu chuẩn -> phải chạy lại calibrate_cameras.py.
    # weight: độ tin cậy so với camera khác (mặc định 1).
    - {name: front, source: "http://127.0.0.1:4747/video", latency_s: 0.05, weight: 1.0, pose: true}
    # Webcam laptop cũ (mờ, 640x480): {name: front, source: 0, latency_s: 0.0, weight: 0.7, pose: true}
    # và đặt lại camera.width/height = 640x480.
    # D435i lệch 45°, cùng độ cao, cùng khoảng cách. Chỉ có 1 RealSense nên serial để trống cũng được.
    # pose: false -> D435i chỉ chạy Hand (bàn tay + depth), không chạy Pose: nhẹ gần một nửa.
    - {name: side45, source: realsense, serial: "", pose: false}
  calib_file: config/cameras_calib.yaml
  # Chế độ nhẹ (như bản Openarm_Teleop chạy mượt trên robot thật): vai/khuỷu/cổ tay từ Pose webcam, bàn tay +
  # hướng bàn tay hợp nhất từ 2 camera + depth. Muốn triangulate cả vai/khuỷu: body_source: triangulate và
  # đặt pose: true cho side45 (nặng hơn gần gấp đôi phần Pose).
  body_source: front
  pair_wait_s: 0.0           # không chờ camera phụ: lấy khung gần nhất đang có -> vòng lặp không khựng

camera:
  # Kích thước khung camera front: DroidCam trên iPhone phát 1280x720 (webcam laptop cũ chỉ 640x480).
  # Phải giống lúc hiệu chuẩn (chương trình kiểm tra). Đổi camera thì sửa lại và chạy lại calibrate_cameras.py.
  width: 1280
  height: 720
  fourcc: null
  fps: 30
  v4l2:                           # cần: sudo apt install v4l-utils. Danh sách control: scripts/webcam_check.py
    power_line_frequency: 1       # 50 Hz (điện VN): hết sọc nhấp nháy dưới đèn huỳnh quang/LED
    # sharpness: 3                # 0-6, mặc định 2. Làm nét trong webcam: cao quá thì viền trắng + nhiễu
    # auto_exposure: 1            # 1 = chỉnh tay (3 = tự động); kèm exposure_time_absolute (625-5000,
    # exposure_time_absolute: 625 #   mặc định 2500): nhỏ hơn = ít nhoè khi tay cử động nhưng tối hơn
  realsense:
    # 848x480 (16:9): đủ góc ngang 70° của cảm biến màu D435i. 640x480 (4:3) bị cắt hai bên còn 56° -> tay hay ra
    # ngoài khung. Góc dọc như nhau (43°). Nội tham số D435i đọc từ máy lúc chạy, không cần hiệu chuẩn lại.
    width: 848
    height: 480
    fps: 30
    spatial_filter: false    # tắt bộ lọc spatial (tốn CPU) để D435i giữ gần 30 fps; median quanh điểm đã khử nhiễu

models:
  # CPU laptop: Pose chỉ chạy trên webcam, 1/2 khung (Hand mỗi khung); Pose hụt <= 6 lần vẫn giữ kết quả cũ.
  # Vẫn chậm (< 12 fps) thì đổi sang bản lite.
  pose: models/pose_landmarker_full.task
  pose_interval: 2
  pose_hold_frames: 6
