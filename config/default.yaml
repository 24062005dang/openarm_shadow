# Cấu hình mặc định. Đơn vị góc: độ (deg) trừ khi ghi khác.

camera:
  index: realsense    # production pipeline chỉ dùng RGB-D từ D455, không dùng camera laptop
  required_source: realsense
  width: 1280
  height: 720
  mirror_display: true   # chỉ lật ảnh khi HIỂN THỊ, MediaPipe luôn chạy trên ảnh gốc
  fourcc: null           # webcam: MJPG để được 720p @ 30 fps (YUYV mặc định thường chỉ ~10 fps ở 720p)
  fps: null
  v4l2: {}               # control webcam qua v4l2-ctl, vd {sharpness: 5}; xem scripts/webcam_check.py
  realsense:
    serial: null         # để null nếu chỉ có một RealSense
    width: 640
    height: 480
    fps: 30
    patch_radius: 3      # median vùng 7x7 quanh landmark
    min_depth_m: 0.3
    max_depth_m: 6.0
    max_local_delta_m: 0.15  # bỏ nền khác cụm depth tại landmark quá 15 cm
    spatial_filter: true      # edge-preserving filter của librealsense
    temporal_filter: true     # ổn định depth giữa các frame
    hand_patch_radius: 2      # patch 5x5: nhỏ hơn body để tránh trộn nền ở cạnh ngón
    hand_min_direct_points: 4 # tối thiểu điểm depth thật để fit z MediaPipe -> metric
    hand_model_hold_frames: 6 # giữ scale/offset metric ngắn hạn khi stereo có lỗ; sau đó báo NONE
    palm_min_points: 35       # số pixel point-cloud tối thiểu để fit mặt phẳng lòng bàn tay
    palm_depth_band_m: 0.06   # bỏ nền/foreground lệch median palm quá 6 cm
    palm_plane_max_rms_m: 0.012
    palm_axis_length_m: 0.08  # chiều dài trục debug vẽ trên ảnh

display:
  # Hình robot mô phỏng: auto = nhiều camera (dải ảnh rộng) thì đặt DƯỚI ảnh camera, rộng bằng cả dải (to, dễ nhìn);
  # 1 camera thì đặt bên phải như cũ. Ép: below | right. Màn hình thấp (768 px) mà cửa sổ bị tràn: hạ robot_height
  # (vd 360) hoặc kéo nhỏ cửa sổ.
  robot_layout: auto
  robot_height: 480

orientation:
  reacquire_frames: 1        # nhận lại ngay; continuity quaternion vẫn chặn flip
  hold_frames: 6             # giữ hướng cũ ngắn hạn khi plane/landmark lỗi
  smoothing: 0.55            # SLERP cơ sở; tự tăng khi người dùng xoay nhanh
  fast_smoothing: 0.90       # bám nhanh khi góc thay đổi lớn
  fast_angle_deg: 75
  max_jump_deg: 155          # chỉ loại gần-flip; 70° trước đây làm trục đứng lại khi xoay nhanh
  min_open_fingers: 3        # chỉ cập nhật hướng khi bàn tay xòe
  body_smoothing: 0.35       # giữ body frame liên tục khi vai/hông depth chập chờn
  body_max_jump_deg: 45

# Fusion nhiều camera: chỉ dùng khi chạy --source multi (xem config/fusion_2cam.yaml và docs/FUSION.md).
fusion:
  calib_file: config/cameras_calib.yaml   # do scripts/calibrate_cameras.py tạo
  cameras: []                # [{name, source: realsense|<chỉ số webcam>, serial, latency_s, weight}]; camera đầu = khung tham chiếu
  sync_tol_s: 0.025          # chờ khung camera phụ lệch <= 25 ms (tối đa pair_wait_s)
  max_skew_s: 0.04           # khung phụ lệch hơn mức này: không ghép lần này (camera đó coi như không có khung)
  reproj_thresh_px: 25       # px quy đổi ảnh 640x480; lớn hơn -> bỏ camera tệ nhất / nhờ depth phân xử
  depth_weight: 0.3          # trọng số depth RealSense so với 2D
  # Vai/khuỷu/cổ tay chỉ 1 camera thấy + depth của nó (triangulate): độ tin cậy x hệ số này. Depth 1 điểm trên
  # khớp tay hay rơi vào thân/nền khi khuỷu bị che -> khuỷu nhảy trước/sau thân -> J1/J3 lật. 0.5: thường dưới
  # filter.min_conf -> khớp giữ thay vì đi theo điểm kém. Bàn tay vẫn dùng 0.8 như cũ.
  body_mono_depth_conf: 0.5
  # Vai/khuỷu/cổ tay triangulate có sai số chiếu lại lớn: độ tin cậy x (1 - (sai số - a) / (b - a)), tối thiểu 0.3.
  # Mặc định a=10, b=30 px: 18 px -> x0.6 (dưới min_conf, khớp giữ). Bình thường 2-8 px không bị ảnh hưởng.
  body_err_conf_px: [10, 30]
  depth_consistency_m: 0.04  # depth lệch nghiệm 2D hơn mức này thì không dùng
  min_visibility: 0.3        # điểm Pose có visibility thấp hơn thì bỏ ở camera đó
  depth: {patch_radius: 3, hand_patch_radius: 2, min_depth_m: 0.3, max_depth_m: 6.0, max_local_delta_m: 0.15}
  # alpha: nhận hướng mới khi nhìn kém (mượt), alpha_max: khi nhìn rõ (ít trễ để cổ tay theo kịp cánh tay)
  orientation: {alpha: 0.6, alpha_max: 0.85, hold_frames: 8, ambiguous_quality: 0.35, max_jump_deg: 100,
                confirm_frames: 4}
  # triangulate: vai/khuỷu/cổ tay triangulate từ mọi camera (mọi camera chạy Pose, nặng hơn);
  # front: vai/khuỷu/cổ tay từ Pose camera 0, camera khác chỉ chạy Hand (nhẹ, mượt; như bản Openarm_Teleop)
  body_source: triangulate
  pair_wait_s: 0.025         # chờ khung khớp của camera phụ tối đa; 0 = không chờ (lấy khung gần nhất đang có)
  # Hướng bàn tay nhiều nguồn (handfusion.OrientationFusion): đổi sang hướng cách > switch_deg cần switch_frames
  # khung liên tiếp (trong lúc chờ cổ tay đứng yên); nguồn lệch > max_disagree_deg bị bỏ; alpha -> fast_alpha khi
  # xoay nhanh (> fast_angle_deg/khung) để không trễ; mất tay giữ hold_frames khung (cổ tay đứng yên) rồi mới LOST.
  # acquire_*: vừa thấy lại tay (sau LOST/CONFLICT, hoặc HOLD rồi thấy ở hướng khác > acquire_jump_deg) thì cổ tay
  # đứng yên tới khi hướng ổn định (< acquire_stable_deg) đủ acquire_frames khung (1 nguồn tính nửa khung).
  orientation_fusion: {temporal_weight: 1.5, switch_deg: 100, switch_frames: 3, max_disagree_deg: 70,
                       alpha: 0.65, fast_alpha: 0.92, fast_angle_deg: 60, hold_frames: 12,
                       acquire_frames: 4, acquire_stable_deg: 20, acquire_jump_deg: 45}
  hand:                      # làm sạch bàn tay 3D (openarm_shadow/handfusion.py)
    wrist_gate_px: 60        # bàn tay ở 1 camera xa cổ tay Pose chiếu vào camera đó hơn mức này -> bỏ (px quy đổi 640x480)
    palm_gate_px: 18         # chế độ front: 5 điểm lòng bàn tay giữa 2 camera lệch (trung vị) hơn mức này -> bỏ camera phụ
    size_ref_px: 35          # bàn tay nhỏ hơn (cổ tay -> gốc ngón giữa, px) thì trọng số giảm (tối thiểu 0,4)
    max_hand_forearm_deg: 100  # ngón tay lệch cẳng tay hơn mức này (cổ tay người không gập được) -> bỏ khung
    palm_max_rms_m: 0.012    # Kabsch 5 điểm lòng bàn tay khớp kém hơn -> bỏ khung
    wrist_from_hand: 0.7     # cổ tay chung cho cẳng tay + bàn tay: 70% cổ tay MediaPipe Hand, 30% Pose
    wrist_agree_m: 0.08      # chỉ trộn khi hai cổ tay cách nhau < 8 cm
  board: {squares_x: 5, squares_y: 7, square_m: 0.035, marker_m: 0.026, dictionary: DICT_4X4_50}

models:
  pose: models/pose_landmarker_full.task
  hand: models/hand_landmarker.task
  min_conf: 0.5
  delegate: cpu              # cpu | gpu | auto. Đo trước bằng scripts/bench_mediapipe.py (GPU Intel chưa chắc nhanh hơn)
  pose_interval: 1           # Pose chạy 1/N khung (Hand vẫn mỗi khung); 2 = nhẹ gần một nửa phần Pose
  pose_hold_frames: 0        # Pose hụt tối đa chừng này lần chạy vẫn giữ kết quả cũ (không mất tay khi Pose chớp)

calibration:
  hand_auto:
    enabled: true
    hold_s: 0.6
    min_samples: 5
    max_motion_deg: 12
    min_open_fingers: 4      # bốn ngón chính; thumb không dùng vì góc tự nhiên biến thiên lớn
    max_upper_from_down_deg: 70  # cho phép tay dang khỏi thân nhưng khuỷu vẫn thấp hơn vai
    max_fore_from_down_deg: 80   # cho phép khuỷu thả lỏng; cổ tay vẫn thấp hơn khuỷu
    max_palm_from_camera_deg: 50 # pháp tuyến lòng bàn tay hướng về D455
    auto_engage_sim_s: 3.0       # chỉ simulation: giữ READY liên tục rồi tự engage

mapping:
  # direct: tay phải người -> tay phải robot (như đứng "bên trong" robot)
  # mirror: tay phải người -> tay trái robot (như soi gương, người đứng đối diện robot)
  mode: direct
  robot_arms: [right, left]

retarget:
  elbow_straight_deg: 12   # tay gần thẳng hơn mức này thì giữ J3 (xoay cánh tay không xác định)
  # Từ 12° tới elbow_j3_full_deg: độ tin cậy J3 tăng dần 0 -> 1. Tay hơi gập (< ~25°) J3 vẫn giữ; bước nhảy J3
  # lớn chỉ nhận khi khuỷu gập rõ (lần chạy thật đầu: J3 trôi tới 87° lúc tay gần thẳng rồi phải quay 147°).
  elbow_j3_full_deg: 30

filter:
  landmark_ema_alpha: 0.8      # EMA trên điểm mốc (Hand Shadowing dùng 0.8)
  # One Euro cho 8 phần tử: J1..J7, kẹp
  min_cutoff: [0.6, 0.6, 0.5, 0.6, 0.5, 0.5, 0.5, 1.5]
  # beta (đơn vị rad/s): bộ lọc tự nới khi khớp chuyển động. 0.02 gần như không nới -> J1-J4 trễ 130-200 ms.
  # Tăng lên 0.4-0.5 (như fusion_real_fast.yaml) bớt ~70 ms trễ nhưng đứng yên rung hơn khi nhiễu Pose lớn (3-5°):
  # đo bằng scripts/measure_lag.py trước khi đổi mặc định.
  beta: [0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.3]
  deadband_deg: [1.5, 1.5, 2.5, 1.5, 3, 3, 3, 0]   # phần tử kẹp tính theo đơn vị 0..1 (0 = tắt)
  jump_deg: 35                 # khớp: độ; phần tử kẹp dùng đơn vị 0..1 (35 = không bao giờ chặn)
  jump_hold_s: 0.2
  # Bước nhảy chỉ nhận khi giá trị mới ổn định suốt jump_hold_s VÀ độ tin cậy >= jump_confirm_conf mỗi khung.
  # Điểm triangulate tốt (2 camera khớp) ~0.8-0.95; 1 camera + depth / 2 camera mâu thuẫn thấp hơn -> không nhận.
  # Cổ tay 0.8: bước nhảy lớn J5-J7 chỉ nhận khi hướng tay TRACKING (>= 2 nguồn đồng ý, 0.9); DEGRADED (1 nguồn,
  # 0.7) vẫn điều khiển cử động nhỏ nhưng không làm cổ tay lật ±87° (lần chạy thật đầu: J5 -87 -> 87).
  jump_confirm_conf: [0.7, 0.7, 0.7, 0.7, 0.8, 0.8, 0.8, 0]
  min_conf: 0.6

grip:
  pinch_ratio: 0.25   # (đầu ngón cái–trỏ)/(chiều dài bàn tay) khi chụm = kẹp đóng
  open_ratio: 0.9     # khi xoè = kẹp mở hết

safety:
  max_vel_deg_s: [45, 45, 60, 60, 90, 90, 90]
  grip_vel_per_s: 1.5
  deadman_s: 0.4
  resume_after_s: 0.3        # khớp đứng yên (mất tay / hướng tay chưa chắc) lâu hơn mức này rồi chạy lại ->
  resume_blend_s: 1.0        #   tăng tốc mềm riêng khớp đó trong 1 s (cổ tay không xoay vụt tới hướng mới)
  engage_blend_s: 1.5
  # Bám theo vận tốc + gửi vận tốc xuống motor (dq của MIT). Mặc định TẮT; bật bằng --config config/velocity_ff.yaml.
  velocity_tracking:
    enabled: false
    gain: 8.0                # 1/s: kéo lệnh về mục tiêu
    extrapolate_s: 0.07      # ngoại suy mục tiêu tối đa 70 ms giữa hai khung camera (bù nhịp 15 fps)
    feedforward: true        # gửi vận tốc lệnh làm dq (bỏ "phanh" kd); false = chỉ làm mượt lệnh
    velocity_smoothing: 0.5  # EMA vận tốc ước lượng giữa 2 khung camera (nhiễu ở 15 fps)
    min_step_deg: 1.0        # đổi < 1° giữa 2 khung coi như đứng yên (không ngoại suy, không feedforward)
    max_acc_deg_s2: [300, 300, 400, 400, 1500, 1500, 1500]
  # Giới hạn khớp mềm theo góc URDF. Mặc định = giới hạn của LeRobot openarm_follower (bảo thủ).
  soft_limits_deg:
    right: [[-75, 75], [-9, 90], [-85, 85], [0, 135], [-85, 85], [-40, 40], [-80, 80]]
    left:  [[-75, 75], [-90, 9], [-85, 85], [0, 135], [-85, 85], [-40, 40], [-80, 80]]
  self_collision:
    enabled: true
    margin_m: 0.03
    radius_m: {upper: 0.05, fore: 0.045, hand: 0.05}

robot:
  interfaces: {right: can0, left: can1}   # quy ước cũ của nhóm; kiểm tra lại bằng read_joints.py
  control_hz: 100
  gain_ramp_s: 1.0
  feedback_timeout_s: 0.1
  poll_feedback_timeout_s: 0.5   # --dry-run: chỉ đọc góc mỗi khung camera (chậm hơn vòng điều khiển 100 Hz)
  # Lọc số đọc rác (phản hồi 0x55 của Damiao bị đọc như gói trạng thái, xem openarm_can_robot.py)
  read_filter:
    max_abs_rad: 3.7          # |q| lớn hơn -> rác
    max_jump_rad: 0.35        # nhảy hơn mức này trong 1 lần đọc (10 ms) -> rác
    bad_hold_s: 0.2           # một khớp đọc hỏng liên tục lâu hơn -> dừng (RobotFault)
    consistent_tol_deg: 1.0   # 2 lần đọc liên tiếp trước khi enable phải lệch ít hơn
    enable_pose_tol_deg: 3.0  # tư thế lúc enable phải gần tư thế lúc connect
  # Gain MIT chính thức v1.0 (openarm_description .../openarm_v1.0/config/arm/control_gains.yaml)
  kp: [70, 70, 70, 60, 10, 10, 10]
  kd: [2.75, 2.5, 2.0, 2.0, 0.7, 0.6, 0.5]
  # Góc motor = sign * góc URDF + offset. MẶC ĐỊNH = đồng nhất, PHẢI KIỂM TRA (docs/SAFETY.md bước 3).
  urdf_to_motor:
    right: {sign: [1, 1, 1, 1, 1, 1, 1], offset_deg: [0, 0, 0, 0, 0, 0, 0]}
    left:  {sign: [1, 1, 1, 1, 1, 1, 1], offset_deg: [0, 0, 0, 0, 0, 0, 0]}
  # Chốt chặn cuối ở mức motor (LeRobot openarm_follower). Viết theo góc URDF; code tự cộng urdf_to_motor.
  motor_limits_deg:
    right: [[-75, 75], [-9, 90], [-85, 85], [0, 135], [-85, 85], [-40, 40], [-80, 80]]
    left:  [[-75, 75], [-90, 9], [-85, 85], [0, 135], [-85, 85], [-40, 40], [-80, 80]]
  gripper:
    enabled: false        # gripper 1.0 có thể đang ở chế độ POS_FORCE; bật khi đã kiểm tra
    open_deg: -60         # MECH_LIM_V1 gripper [-60, 0]; chiều nào là mở phải đo lại
    closed_deg: 0
    kp: 5.0
    kd: 0.1
  gravity_comp:
    enabled: false
    urdf: null            # đường dẫn tới openarm_description/.../openarm_v1.0/urdf/example/v1.urdf
  rest_pose_deg: [0, 0, 0, 0, 0, 0, 0]   # tư thế nghỉ (tay thả xuôi) để về trước khi tắt
  park_vel_deg_s: 20
