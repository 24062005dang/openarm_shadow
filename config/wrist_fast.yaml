# Cổ tay J5-J7 bám nhanh hơn (chỉ ghi các khoá khác config/default.yaml).
#   python scripts/shadow.py --source 0 --arms right --config config/wrist_fast.yaml
#
# CHỈ DÙNG CHO MÔ PHỎNG. Chưa dùng cho robot thật: J5-J7 ở đây tới 180°/s.
# Muốn đưa sang robot thật thì chép phần filter/orientation vào config thật và giữ max_vel cổ tay
# ở mức thấp (tăng dần 15 -> 30 -> 45°/s, có người cầm E-stop).
# J1-J4 và kẹp giữ nguyên như default.

filter:
  # One Euro: beta tính theo rad/s, nên 0.02 gần như không tăng cutoff khi xoay nhanh (trễ ~0.3 s).
  # Cổ tay: beta 0.8 -> xoay 3 rad/s thì cutoff ~3.4 Hz (trễ ~0.05 s); đứng yên vẫn lọc ở 1 Hz.
  #           J1   J2   J3   J4   J5   J6   J7   kẹp
  min_cutoff: [0.6, 0.6, 0.5, 0.6, 1.0, 1.0, 1.0, 1.5]
  beta:       [0.02, 0.02, 0.02, 0.02, 0.8, 0.8, 0.8, 0.3]
  deadband_deg: [1.5, 1.5, 2.5, 1.5, 2, 2, 2, 0]
  # Ở ~11 fps, lật cổ tay nhanh đổi >35° mỗi khung -> bị coi là lỗi và giữ 0.2 s. Cổ tay nới lên 90°.
  jump_deg:   [35, 35, 35, 35, 90, 90, 90, 35]

orientation:
  smoothing: 0.7             # SLERP hướng bàn tay mỗi khung (default 0.55)
  fast_smoothing: 0.95
  fast_angle_deg: 45         # từ 45° thay đổi/khung là bám gần như thẳng (default 75)

safety:
  max_vel_deg_s: [45, 45, 60, 60, 180, 180, 180]
